name: Wonderverse Site Quality

on:
  pull_request:
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "quest.js"
      - "privacy.html"
      - "terms.html"
      - "favicon.svg"
      - "social-preview.svg"
      - "tests/site_checks.py"
      - "tests/browser_smoke.cjs"
      - ".github/workflows/site-quality.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "quest.js"
      - "privacy.html"
      - "terms.html"
      - "tests/site_checks.py"
      - "tests/browser_smoke.cjs"
      - ".github/workflows/site-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-site-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax validation
        run: |
          node --check script.js
          node --check quest.js
      - name: Pages, navigation, accessibility and mini-game asset checks
        run: python tests/site_checks.py
      - name: Verify Chrome is present
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Install headless-browser test driver
        run: npm install --no-save --no-package-lock puppeteer-core@24.26.1
      - name: Real browser interaction smoke test
        run: node tests/browser_smoke.cjs
